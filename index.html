<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/mobilstyle.css">
  <title>Food delivery</title>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="img/placeholder1.jpg" alt="Bootstrap" width="30" height="24">
        </a>
        <a class="navbar-brand" href="index.html">Food Delivery Managament System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active px-4" aria-current="page" href="index.html"><i class="bi bi-cart2"></i></a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-4" href="profil.html"><i class="bi bi-person"></i></a>
            </li>
            <li class="nav-item">
              <p class="ido ps-5"></p>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-fluid py-3">
    <div class="row me-2">
      <section class="col-lg-4">
        <div class="card w-500 mb-5">
          <div class="card-body">
            <h5 class="card-title">Rendelések Értéke:</h5>
            <p class="card-text">Összesen: 0 Ft</p>
          </div>
        </div>
        <div class="card w-500 mb-3">
          <div class="card-body">
            <div id="terkep" style="height: 400px; width: 100%;"></div>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="row">
          <div class="card w-500 mb-5 col-lg-6 me-3">
            <div class="card-body">
              <h5 class="card-title">Összes Rendelés</h5>
              <p class="card-text">Összes rendelés: 0</p>
            </div>
          </div>
          <div class="card w-500 mb-5 col-lg-5">
            <div class="card-body">
              <h5 class="card-title">Legközelebbi rendelés:</h5>
              <p class="card-text">Legközelebbi: 0p</p>
            </div>
          </div>
        </div>

        <div class="card w-500 mb-5">
          <div class="card-body">

            <div class="accordion mb-4" id="accordionExample">
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                    Rendelés
                  </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                  <div class="accordion-body">
                    <form>
                      <div class="mb-3">
                        <label class="form-label">Rendelő neve:</label>
                        <input type="text" class="form-control marka">
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Város:</label>
                        <input type="text" class="form-control varos">
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Telefonszám:</label>
                        <input type="tel" class="form-control telefon" placeholder="+36 30 356 4987">
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Étel:</label>
                        <input type="text" class="form-control etel" placeholder="pl. Pizza, Gyros, Gulyásleves">
                      </div>

                      <div class="mb-3">
                        <button type="button" class="btn btn-success hozzaad">Hozzáadás</button>
                        <button type="button" class="btn btn-secondary megse">Mégse</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>

            <table class="table">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Megrendelő</th>
                  <th scope="col">Helyszín</th>
                   <th scope="col">Telefonszám</th>
                   <th scope="col">Étel</th>
                  <th scope="col">lemondása/szerkeztése</th>
                </tr>
              </thead>
              <tbody>
              </tbody>
            </table>

          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="sikeresModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="hibaModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Hiba</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="exampleModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Rendelés lemondása</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Biztosan lemondod a rendelést?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
          <button type="button" class="btn btn-danger torles" data-bs-dismiss="modal">Lemondás</button>
        </div>
      </div>
    </div>
  </div>

    <footer class=""><p>Minden jog fenntartva!&copy;</p></footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/Etel.js"></script>
  <script src="js/Etelteszt.js"></script>
  <script src="js/etelscript.js"></script>
  <script src="js/script.js"></script>
  <script src="js/terkep.js"></script>
</body>

</html>
