<body>

            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="container-fluid py-3">
    <div class="row me-2">
      <section class="col-lg-4">
        <div class="card w-500 mb-5">
          <div class="card-body">
            <h5 class="card-title">Összes Rendelés</h5>
            <p class="card-text">Összes rendelés: 0</p>
          </div>
        </div>
        <div class="card w-500 mb-3">
          <div class="card-body">
            <h1>ITT LESZ A TÉRKÉP</h1>
          </div>
        </div>
      </section>
      <section class="col-lg-8">
        <div class="row">
          <div class="card w-500 mb-5 col-lg-6 me-3">
            <div class="card-body">
              <h5 class="card-title">Összes Rendelés</h5>
              <p class="card-text">Összes rendelés: 0</p>
            </div>
          </div>
          <div class="card w-500 mb-5 col-lg-5">
            <div class="card-body">
              <h5 class="card-title">Összes Rendelés</h5>
              <p class="card-text">Összes rendelés: 0</p>
            </div>
          </div>
        </div>
        <div class="accordion" id="accordionExample">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
                aria-expanded="true" aria-controls="collapseOne">
                Rendelések
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <div class="card w-500 mb-5">
                  <div class="card-body">
                    <table class="table">
                      <thead>
                        <tr>
                          <th scope="col">#</th>
                          <th scope="col">First</th>
                          <th scope="col">Last</th>
                          <th scope="col">Handle</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <th scope="row">1</th>
                          <td>Mark</td>
                          <td>Otto</td>
                          <td>@mdo</td>
                        </tr>
                        <tr>
                          <th scope="row">2</th>
                          <td>Jacob</td>
                          <td>Thornton</td>
                          <td>@fat</td>
                        </tr>
                        <tr>
                          <th scope="row">3</th>
                          <td>John</td>
                          <td>Doe</td>
                          <td>@social</td>
                        </tr>
                      </tbody>
                    </table>
                    <form>
                      <div class="mb-3">
                        <label class="form-label">Rendelő neve:</label>
                        <input type="text" class="form-control marka">
                      </div>


                      <div class="row mb-3">
                        <div class="col-md-4">
                          <label class="form-label">Irányítószám:</label>
                          <input type="text" class="form-control iranyitoszam" maxlength="4" pattern="[0-9]{4}"
                            inputmode="numeric" placeholder="1111">
                        </div>
                        <div class="col-md-8">
                          <label class="form-label">Város:</label>
                          <input type="text" class="form-control varos">
                        </div>
                      </div>

                      <div class="row mb-3">
                        <div class="col-md-6">
                          <label class="form-label">Utca:</label>
                          <input type="text" class="form-control utca">
                        </div>
                        <div class="col-md-2">
                          <label class="form-label">Házszám:</label>
                          <input type="text" class="form-control hazszam">
                        </div>
                        <div class="col-md-2">
                          <label class="form-label">Emelet:</label>
                          <input type="text" class="form-control emelet">
                        </div>
                        <div class="col-md-2">
                          <label class="form-label">Ajtó:</label>
                          <input type="text" class="form-control ajto">
                        </div>
                      </div>


                      <div class="mb-3">
                        <label class="form-label">Telefonszám:</label>
                        <input type="tel" class="form-control telefon" placeholder="+36 30 356 4987"
                          pattern="^(\+36|06)[\s-]?\d{1,2}[\s-]?\d{3}[\s-]?\d{3,4}$"
                          title="Pl.: +36 30 356 4987 vagy 06-30-356-4987">
                      </div>
                      <label class="form-label">Kiszállítás</label>
                      <select class="form-select szin" aria-label="Default select example">
                        <option selected value="">Válasszon:</option>
                        <option value="Kék">Bejön érte az éttermünkbe</option>
                        <option value="Fehér">Kiszállítás (+600FT)</option>
                      </select>
                  </div>
                  <div class="mb-3">
                    <button type="button" class="btn btn-success hozzaad">Hozzáadás</button>
                    <button type="button" class="btn btn-secondary megse">Mégse</button>
                  </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
    </div>
    </section>
  </main>
  <footer></footer>


  <script src="js/Etel.js"></script>
